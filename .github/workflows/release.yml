name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sqlmesh-spec-kit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv run --extra dev ruff check src tests
      - run: uv run --extra dev mypy src tests
      - run: uv run --extra dev pytest
      - run: uv run --extra dev python -m build --sdist --wheel
      - run: uv run --extra dev python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
